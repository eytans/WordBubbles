name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Required for creating releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release

      - name: Copy privacy policy to web build
        run: cp privacy-policy.html build/web/privacy-policy.html

      - name: Create web archive
        run: |
          cd build/web
          zip -r ../../wordbubbles-web-${{ github.ref_name }}.zip .
          cd ../..

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: wordbubbles-web-${{ github.ref_name }}.zip

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Rename Android App Bundle
        run: |
          mv build/app/outputs/bundle/release/app-release.aab wordbubbles-${{ github.ref_name }}.aab

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: wordbubbles-${{ github.ref_name }}.aab
          if-no-files-found: error

      - name: Verify signed Android App Bundle
        run: jarsigner -verify -verbose -certs wordbubbles-${{ github.ref_name }}.aab

      - name: Build signed APK (optional convenience artifact)
        run: flutter build apk --release

      - name: Rename signed APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk wordbubbles-${{ github.ref_name }}.apk

      - name: Upload optional Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: wordbubbles-${{ github.ref_name }}.apk
          if-no-files-found: error

  create-release:
    needs: [build-web, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: android-aab

      - name: Download optional Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WordBubbles ${{ steps.get_version.outputs.version }}
          body: |
            ## WordBubbles Release ${{ steps.get_version.outputs.version }}
            
            ### What's New
            - Bug fixes and improvements
            
            ### Downloads
            - **Web Version**: Download the web build and serve it with any web server
            - **Android App Bundle**: Upload to Google Play Console for testing or release
            - **Android APK (optional)**: Install directly on Android devices
            
            ### Installation Instructions
            
            #### Web Version
            1. Download the web build zip file
            2. Extract the contents
            3. Serve the files using any web server (e.g., `python3 -m http.server 8000`)
            4. Open your browser and navigate to the server address
            
            #### Android App Bundle
            1. Download the AAB file
            2. Upload it to the desired Google Play Console testing or release track

            #### Android APK (optional)
            1. Download the APK file
            2. Enable "Install from unknown sources" in your Android settings
            3. Install the APK file
            
            ### System Requirements
            - **Web**: Modern web browser with JavaScript enabled
            - **Android**: Android 5.0 (API level 21) or higher
          files: |
            wordbubbles-web-${{ github.ref_name }}.zip
            wordbubbles-${{ github.ref_name }}.aab
            wordbubbles-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
